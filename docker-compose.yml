version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15
    container_name: scada_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - key.env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scada_network

  # Backend Django + DRF
  backend:
    build:
      context: ./mysite
      dockerfile: Dockerfile
    container_name: scada_backend
    entrypoint: [ "/app/entrypoint.sh" ]
    command: [ "gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "--threads", "4", "mysite.wsgi:application" ]
    volumes:
      - ./mysite:/app
      - ./mosquitto/config:/mosquitto/config
    ports:
      - "8000:8000"
    env_file:
      - key.env
      - .env.smtp
    environment:
      - DEBUG=1
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,backend,host.docker.internal,100.69.41.46,100.125.119.27,scada-system.duckdns.org,remarry-anyplace-appraiser.ngrok-free.dev,*.ngrok-free.dev,*.ngrok-free.app,*.ngrok.io
      - FRONTEND_URL=${FRONTEND_URL:-https://remarry-anyplace-appraiser.ngrok-free.dev}
      - DB_HOST=db
      - DB_PORT=5432

    depends_on:
      db:
        condition: service_healthy
    networks:
      - scada_network

  # Worker de MQTT en segundo plano
  mqtt_worker:
    image: ic2-ic3-backend
    build:
      context: ./mysite
      dockerfile: Dockerfile
    container_name: scada_mqtt_worker
    entrypoint: [ "/app/entrypoint.sh" ]
    command: [ "python", "manage.py", "mqtt_worker" ]
    volumes:
      - ./mysite:/app
    env_file:
      - key.env
      - .env.smtp
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      mosquitto:
        condition: service_healthy
    networks:
      - scada_network
    restart: unless-stopped

  # Frontend React + Vite
  frontend:
    build:
      context: ./scada-ui
      dockerfile: Dockerfile
    container_name: scada_frontend
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./scada-ui:/app:delegated
      - scada_ui_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
    networks:
      - scada_network

  # Broker MQTT - Mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: scada_mqtt_broker
    ports:
      - "1883:1883" # Puerto MQTT
      - "9001:9001" # Puerto WebSocket (opcional para MQTT sobre WS)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
      # Se elimina el volumen nombrado para evitar conflicto con el bind mount local
      # Run the init script via shell so it doesn't require the executable bit on the file
    command: [ "sh", "-c", "/mosquitto/config/init_mosquitto.sh" ]
    networks:
      - scada_network
    restart: unless-stopped
    healthcheck:
      # Evita usar mosquitto_sub sin credenciales (falla con allow_anonymous false).
      # Comprobamos que el proceso mosquitto esté en ejecución dentro del contenedor.
      test: [ "CMD-SHELL", "pgrep mosquitto || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ngrok Tunnel para Acceso Web Remoto Seguro HTTPS Cero-Puertos
  tunnel:
    image: ngrok/ngrok:latest
    container_name: scada_ngrok_tunnel
    restart: unless-stopped
    env_file:
      - key.env
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "frontend:5173"
    networks:
      - scada_network
    depends_on:
      - frontend

volumes:
  postgres_data:
  mosquitto_data:
  scada_ui_node_modules:

networks:
  scada_network:
    driver: bridge
